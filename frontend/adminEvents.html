<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Events - Sound Events</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #111827;
      }

      header {
        background: #111827;
        color: white;
        padding: 18px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      header h1 {
        margin: 0;
        font-size: 22px;
      }

      .logout-button {
        background: #dc2626;
        color: white;
        border: none;
        padding: 9px 15px;
        border-radius: 6px;
        cursor: pointer;
      }

      .container {
        max-width: 1200px;
        margin: 30px auto;
        padding: 0 20px;
      }

      .card {
        background: white;
        border-radius: 10px;
        padding: 25px;
        margin-bottom: 25px;
        box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
      }

      h2 {
        margin-top: 0;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      .full-width {
        grid-column: 1 / -1;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
      }

      input,
      textarea,
      select {
        width: 100%;
        padding: 11px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 15px;
      }

      textarea {
        min-height: 100px;
        resize: vertical;
      }

      .buttons {
        margin-top: 20px;
        display: flex;
        gap: 10px;
      }

      button {
        border: none;
        padding: 11px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }

      .primary {
        background: #111827;
        color: white;
      }

      .secondary {
        background: #e5e7eb;
        color: #111827;
      }

      .danger {
        background: #dc2626;
        color: white;
      }

      .edit {
        background: #2563eb;
        color: white;
        margin-right: 5px;
      }

      .event-list {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 12px;
        border-bottom: 1px solid #e5e7eb;
        text-align: left;
        vertical-align: top;
      }

      th {
        background: #f9fafb;
      }

      .status {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
      }

      .published {
        background: #dcfce7;
        color: #166534;
      }

      .draft {
        background: #fef3c7;
        color: #92400e;
      }

      #message {
        margin-bottom: 20px;
        font-weight: bold;
      }

      @media (max-width: 700px) {
        .form-grid {
          grid-template-columns: 1fr;
        }

        .full-width {
          grid-column: auto;
        }

        header {
          padding: 15px;
        }

        .container {
          margin-top: 20px;
        }
      }

      /* =========================================
   MEDIA UPLOAD
========================================= */

      .media-upload-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 15px;
      }

      .media-help {
        margin: 5px 0 0;
        color: #6b7280;
        font-size: 13px;
        font-weight: normal;
        line-height: 1.5;
      }

      .media-upload-buttons {
        display: flex;
        gap: 10px;
        flex-shrink: 0;
      }

      .upload-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 15px;
        background: #111827;
        color: white;
        border-radius: 7px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: 0.2s ease;
      }

      .upload-button:hover {
        background: #1f2937;
        transform: translateY(-1px);
      }

      .video-upload-button {
        background: #374151;
      }

      .video-upload-button:hover {
        background: #4b5563;
      }

      /* =========================================
   MEDIA STATUS
========================================= */

      .media-upload-status {
        min-height: 20px;
        margin-bottom: 12px;
        font-size: 13px;
        color: #6b7280;
      }

      /* =========================================
   MEDIA PREVIEW GRID
========================================= */

      .media-preview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 15px;
      }

      /* =========================================
   MEDIA PREVIEW CARD
========================================= */

      .media-preview-card {
        position: relative;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #f9fafb;
        min-height: 160px;
      }

      .media-preview-card img,
      .media-preview-card video {
        display: block;
        width: 100%;
        height: 180px;
        object-fit: cover;
        background: #111827;
      }

      /* =========================================
   MEDIA TYPE
========================================= */

      .media-type-badge {
        position: absolute;
        top: 9px;
        left: 9px;
        padding: 4px 8px;
        border-radius: 5px;
        background: rgba(17, 24, 39, 0.85);
        color: white;
        font-size: 10px;
        font-weight: bold;
        letter-spacing: 0.5px;
      }

      /* =========================================
   REMOVE MEDIA
========================================= */

      .remove-media-button {
        position: absolute;
        top: 8px;
        right: 8px;

        width: 30px;
        height: 30px;

        padding: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: rgba(220, 38, 38, 0.95);
        color: white;

        font-size: 18px;
        font-weight: bold;

        cursor: pointer;
      }

      .remove-media-button:hover {
        background: #b91c1c;
      }

      /* =========================================
   MEDIA UPLOAD PROGRESS
========================================= */

      .media-uploading {
        position: absolute;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(17, 24, 39, 0.75);
        color: white;

        font-size: 13px;
        font-weight: bold;
      }

      /* =========================================
   EMPTY STATE
========================================= */

      .empty-media-state {
        border: 2px dashed #d1d5db;
        border-radius: 10px;
        padding: 35px 20px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        text-align: center;

        color: #6b7280;
      }

      .empty-media-state strong {
        color: #374151;
        margin-bottom: 5px;
      }

      .empty-media-state span {
        font-size: 13px;
      }

      .empty-media-icon {
        width: 45px;
        height: 45px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: #f3f4f6;
        color: #6b7280;

        font-size: 24px;

        margin-bottom: 10px;
      }

      /* =========================================
   TABLE IMPROVEMENTS
========================================= */

      .event-list {
        overflow-x: auto;
      }

      .event-list table {
        min-width: 850px;
      }

      .event-list tbody tr {
        transition: background 0.15s ease;
      }

      .event-list tbody tr:hover {
        background: #f9fafb;
      }

      .event-title-cell {
        min-width: 220px;
      }

      .event-title {
        font-weight: 700;
        color: #111827;
      }

      .event-slug {
        margin-top: 4px;
        color: #9ca3af;
        font-size: 12px;
      }

      .event-media-count {
        display: inline-flex;
        align-items: center;
        gap: 5px;

        padding: 5px 9px;

        border-radius: 6px;

        background: #f3f4f6;
        color: #374151;

        font-size: 12px;
        font-weight: 600;
      }

      .action-buttons {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .action-buttons button {
        white-space: nowrap;
      }

      /* =========================================
   MOBILE
========================================= */

      @media (max-width: 700px) {
        .media-upload-header {
          flex-direction: column;
        }

        .media-upload-buttons {
          width: 100%;
        }

        .upload-button {
          flex: 1;
        }

        .media-preview-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Sound Events — Events Management</h1>
      <button class="logout-button" id="logoutButton">Logout</button>
    </header>

    <div class="container">
      <div id="message"></div>

      <div class="card">
        <h2 id="formTitle">Create Event</h2>

        <form id="eventForm">
          <div class="form-grid">
            <div>
              <label for="title">Title</label>
              <input type="text" id="title" required />
            </div>

            <div>
              <label for="slug">Slug</label>
              <input
                type="text"
                id="slug"
                readonly
                style="background: #f9fafb; color: #6b7280"
              />
            </div>

            <div class="full-width">
              <label for="description">Description</label>
              <textarea id="description"></textarea>
            </div>

            <div>
              <label for="event_date">Event Date & Time</label>
              <input type="datetime-local" id="event_date" required />
            </div>

            <div>
              <label for="location">Location</label>
              <input type="text" id="location" />
            </div>

            <div class="full-width">
              <div class="media-upload-header">
                <div>
                  <label>Event Media</label>

                  <p class="media-help">
                    Add photos and videos to this event. You can review
                    everything before creating or updating the event.
                  </p>
                </div>

                <div class="media-upload-buttons">
                  <label class="upload-button">
                    + Add Photos
                    <input
                      type="file"
                      id="image"
                      accept="image/*"
                      multiple
                      hidden
                    />
                  </label>

                  <label class="upload-button video-upload-button">
                    + Add Videos
                    <input
                      type="file"
                      id="video"
                      accept="video/mp4,video/webm,video/quicktime"
                      multiple
                      hidden
                    />
                  </label>
                </div>
              </div>

              <div id="mediaUploadStatus" class="media-upload-status"></div>

              <div id="mediaPreviewGrid" class="media-preview-grid"></div>

              <div id="emptyMediaState" class="empty-media-state">
                <div class="empty-media-icon">＋</div>

                <strong>No media added yet</strong>

                <span> Add photos or videos using the buttons above. </span>
              </div>
            </div>

            <div>
              <label for="video">Event Video</label>

              <input
                type="file"
                id="video"
                accept="video/mp4,video/webm,video/quicktime"
              />

              <div style="margin-top: 10px">
                <video
                  id="videoPreview"
                  controls
                  style="
                    display: none;
                    width: 320px;
                    max-width: 100%;
                    height: 180px;
                    object-fit: cover;
                    border-radius: 8px;
                    border: 1px solid #d1d5db;
                    background: #000;
                  "
                ></video>
              </div>

              <small
                id="videoUploadStatus"
                style="display: block; margin-top: 8px; color: #6b7280"
              ></small>
            </div>

            <div>
              <label for="status">Status</label>
              <select id="status">
                <option value="draft">Draft</option>
                <option value="published">Published</option>
              </select>
            </div>
          </div>

          <div class="buttons">
            <button type="submit" class="primary" id="saveButton">
              Create Event
            </button>

            <button
              type="button"
              class="secondary"
              id="cancelButton"
              style="display: none"
            >
              Cancel Edit
            </button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Events</h2>

        <div class="event-list">
          <table>
            <thead>
              <tr>
                <th>Event</th>
                <th>Date</th>
                <th>Location</th>
                <th>Media</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="eventsTableBody">
              <tr>
                <td colspan="6">Loading events...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="api.js"></script>
    <script src="adminEvents.js"></script>
  </body>
</html>
